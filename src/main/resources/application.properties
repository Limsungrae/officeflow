spring.application.name=officeflow

# Local persistent database. No separate DB installation is required.
spring.datasource.url=jdbc:h2:file:./data/officeflow;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/interactions}

gemini.connect-timeout=5s
gemini.request-timeout=60s
